<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaféTec - Pedidos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>CaféTec - Pedidos del mostrador</h1>

    <form id="form-pedido" novalidate>
      <input id="producto" placeholder="Producto">
      <input id="precio" type="number" step="0.10" placeholder="Precio S/">
      <input id="cantidad" type="number" min="0" placeholder="Cantidad">
      <button type="submit">Agregar</button>
    </form>
    <p id="mensaje" aria-live="polite"></p>

    <label for="filtro">Filtrar:</label>
    <select id="filtro">
      <option value="todos">Todos</option>
      <option value="pendiente">Pendientes</option>
      <option value="entregado">Entregados</option>
    </select>

    <ul id="lista-pedidos"></ul>
    <p id="total"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
